plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Modrinth's Maven, used only to compile against WATERMeDIA.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:watermedia:${watermedia_version}"
    localRuntime "maven.modrinth:watermedia:${watermedia_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            watermedia_version     : watermedia_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
var engineBundle = tasks.register('bundleMovieHubEngine', Zip) {
    def upstream = layout.projectDirectory.dir('upstream-moviehub/android-tv-launcher/app/src/main')
    from(upstream.dir('python'))
    from(upstream.dir('assets/licenses/vod')) { into 'licenses' }
    from('src/engine')
    from(layout.buildDirectory.dir('engine-packages')) { into 'packages' }
    exclude '**/__pycache__/**', '**/*.pyc'
    archiveFileName = 'moviehub-engine.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/engine')
    doFirst {
        if (!upstream.file('python/moviehub_vod.py').asFile.exists()) {
            throw new GradleException('Checkout pinned MovieHub source in upstream-moviehub before building; see README.md')
        }
        if (!layout.buildDirectory.file('engine-packages/requests/__init__.py').get().asFile.exists()) {
            throw new GradleException('Collect the portable Python dependencies in build/engine-packages before building; see CI workflow')
        }
    }
}
tasks.named('processResources') { dependsOn engineBundle; from(engineBundle) }
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('freeVodRegression', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.client.FreeVodRegression'
}
tasks.named('check') { dependsOn 'freeVodRegression' }
tasks.register('tmdbRegression', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.catalogue.TmdbRegression'
}
tasks.named('check') { dependsOn 'tmdbRegression' }
tasks.register('mediaTransportRegression', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.client.ProviderPngSegmentsTest'
}
tasks.named('check') { dependsOn 'mediaTransportRegression' }
tasks.register('mediaRelayRegression', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.client.MediaRelayRegression'
}
tasks.named('check') { dependsOn 'mediaRelayRegression' }
tasks.register('engineBridgeRegression', JavaExec) {
    dependsOn regressionClasses, processResources
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.catalogue.EngineBridgeRegression'
}
tasks.named('check') { dependsOn 'engineBridgeRegression' }
tasks.register('freeVodProbe', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.billyke2000s.moviehubtv.client.FreeVodProbe'
}

