name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout the exact MovieHub free-provider runtime
        uses: actions/checkout@v4
        with:
          repository: billyke2000s/moviehub
          ref: 08343545afd7b535f8c9112f818ad60ee4432bd4
          path: upstream-moviehub
          sparse-checkout: |
            android-tv-launcher/app/src/main/python
            android-tv-launcher/app/src/main/assets/licenses/vod
            android-tv-launcher/tests

      - name: Check the real MovieHub resolver and bridge
        run: |
          python3 -m pip install requests==2.32.5 six==1.17.0
          python3 upstream-moviehub/android-tv-launcher/tests/test_free_vod.py
          python3 tests/test_moviehub_worker.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: TV placement and wall regression checks
        run: python3 tests/run_tv_regressions.py

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|warning: \[removal\]|What went wrong|Could not|Caused by|> " -A2 build.log | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: moviehubtv-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Verify bundled MovieHub engine bytes and notices
        run: python3 tests/check_engine_bundle.py

      - name: Real MovieHub free services smoke check (runner region)
        continue-on-error: true
        run: python3 tests/probe_moviehub_engine.py

      - name: Publish latest jar as a release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MovieHub TV (latest build)
          prerelease: true
          make_latest: false
          files: build/libs/*.jar

      # A stable, versioned release (tag v<mod_version>) is created once per version.
      # Later pushes with the same mod_version leave that release unchanged; bump
      # mod_version in gradle.properties to publish the next one.
      - name: Check for an existing versioned release
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          test -f "build/libs/moviehubtv-$ver.jar"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$ver already exists; not changing it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MovieHub TV ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: build/libs/moviehubtv-${{ steps.version.outputs.version }}.jar
          body: |
            MovieHub TV ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (NeoForge).

            Install `moviehubtv-${{ steps.version.outputs.version }}.jar` in the `mods` folder on the server **and** every player's game; both sides must run the same version. Players also need WATERMeDIA 2.1.37 or newer, below 3.0 (client only).

            Built by GitHub Actions from ${{ github.sha }}. See [STATUS.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/STATUS.md) for changes and what has and has not been tested in-game.
    permissions:
      contents: write

